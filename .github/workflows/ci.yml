name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage

  database:
    name: RLS and auth tests (throwaway local Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: latest
      - name: Start local Supabase
        run: supabase start -x realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Configure local test credentials
        run: |
          scripts/local-supabase-env.sh >> "$GITHUB_ENV"
          scripts/local-supabase-env.sh | grep -q '^NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:'
      - run: npm run test:db

  demo:
    name: Browser-only demo smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:demo

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run gitleaks on the full history
        run: |
          printf 'token = "ghp_%s%s%s"\n' 'aBcDeFgHiJkL' 'mNoPqRsTuVwX' 'yZ0123456789' > "$RUNNER_TEMP/gitleaks-canary.txt"
          image='ghcr.io/gitleaks/gitleaks@sha256:75bdb2b2f4db213cde0b8295f13a88d6b333091bbfbf3012a4e083d00d31caba'
          docker pull "$image"
          set +e
          docker run --rm --network none --volume "$RUNNER_TEMP:/tmp" "$image" detect --no-git --source /tmp/gitleaks-canary.txt --redact --report-format json --report-path /tmp/gitleaks-canary.json > "$RUNNER_TEMP/gitleaks-canary.log" 2>&1
          scan_status=$?
          set -e
          if [ "$scan_status" -ne 1 ] || ! jq --exit-status 'any(.[]; .RuleID == "github-pat")' "$RUNNER_TEMP/gitleaks-canary.json" >/dev/null; then
            cat "$RUNNER_TEMP/gitleaks-canary.log"
            echo 'A Gitleaks-próba nem igazolta a GitHub-token felismerését.'
            exit 1
          fi
          docker run --rm --network none --volume "$GITHUB_WORKSPACE:/repo:ro" --workdir /repo "$image" git --redact --verbose --exit-code 1 .
